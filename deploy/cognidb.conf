# ==============================================================================
# CogniDB AI-Native Database Production Configuration (VM & Cloud Deployment)
# ==============================================================================

# --- Network & Binding ---
# Set bind_address to 0.0.0.0 to expose CogniDB to external network interfaces
bind_address=0.0.0.0
port=8080

# --- Authentication & Connection String Security ---
auth_enabled=true
admin_user=cogni_admin
admin_password=ChangeMeInProduction_Pass123!

# --- Storage & Data Directories ---
data_dir=/var/lib/cognidb/data
wal_dir=/var/lib/cognidb/wal
snapshot_dir=/var/lib/cognidb/snapshots

# --- Distributed Cluster & Consensus ---
cluster_name=cognidb-production-cluster
cluster_seeds=10.0.1.10:8080,10.0.1.11:8080,10.0.1.12:8080
raft_election_timeout_ms=300

# --- Security Firewall & Data Leakage Protection ---
firewall_enabled=true
rate_limit_per_sec=1000
dlp_masking_enabled=true

# --- SSL / TLS Encryption In-Transit ---
ssl_enabled=false
# ssl_cert_chain=/etc/cognidb/certs/server.crt
# ssl_private_key=/etc/cognidb/certs/server.key
